<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="crystal-ball.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="medias.css">
    <script src="https://kit.fontawesome.com/db09709f66.js" crossorigin="anonymous"></script>
    <title>Witchy</title>
</head>
<body>
    <header class="topsymptoms">
        <div class="arrowleft">
            <i class="fa-solid fa-angle-left"></i>
        </div>
        <h3>What are you feeling today?</h3>
        <div class="arrowright">
            <i class="fa-solid fa-angle-right"></i>
        </div>
        <div class="home">
            <a href="index.html">
                <img src="images/crystalball.png" alt="home icon crystal ball">
            </a>
            <p>Home</p>
        </div>
    </header>
    <section class="mood">
        <h3>Mood</h3>
        <div class="moodGrid">
            <div class="moodImg">
                <img src="images/happy.png" alt="happy emoji face">
                <span>Happy</span>
            </div>
            <div class="moodImg">
                <img src="images/calm.png" alt="calm emoji face">
                <span>Calm</span>
            </div>
            <div class="moodImg">
                <img src="images/frisky.png" alt="frisky emoji face">
                <span>Frisky</span>
            </div>
            <div class="moodImg">
                <img src="images/angry.png" alt="angry emoji face">
                <span>Angry</span>
            </div>
            <div class="moodImg">
                <img src="images/sad.png" alt="sad emoji face">
                <span>Sad</span>
            </div>
            <div class="moodImg">
                <img src="images/anxious.png" alt="anxious emoji face">
                <span>Anxious</span>
            </div>
            <div class="moodImg">
                <img src="images/depressed.png" alt="depressed emoji face">
                <span>Depressed</span>
            </div>
        </div>
    </section>
    <section class="symptoms">
        <h3>Symptoms</h3>
        <div class="symptomsGrid">
            <div class="symptomsIcon">
                <img src="images/backache.png" alt="backache emoji symptom">
                <span>Backache</span>
            </div>
            <div class="symptomsIcon">
                <img src="images/bloating.png" alt="bloating emoji symptom">
                <span>Bloating</span>
            </div>
            <div class="symptomsIcon">
                <img src="images/cramps.png" alt="cramps emoji symptom">
                <span>Cramps</span>
            </div>
            <div class="symptomsIcon">
                <img src="images/cravings.png" alt="cravings emoji symptom">
                <span>Cravings</span>
            </div>
            <div class="symptomsIcon">
                <img src="images/fatigue.png" alt="fatigue emoji symptom">
                <span>fatigue</span>
            </div>
            <div class="symptomsIcon">
                <img src="images/headache.png" alt="headache emoji symptom">
                <span>Headache</span>
            </div>
            <div class="symptomsIcon">
                <img src="images/insomnia.png" alt="insomnia emoji symptom">
                <span>Insomnia</span>
            </div>
            <div class="symptomsIcon">
                <img src="images/tender-brests.png" alt="tender breasts emoji symptom">
                <span>Tender Breasts</span>
            </div>
        </div>
    </section>
    <footer>
        <p>Website developed by Tainá Klein <i class="fa-regular fa-copyright"></i> 2026</p>
    </footer>
    <script src="interaction.js"></script>
</body>
</html>
