<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="crystal-ball.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="medias.css">
    <script src="https://kit.fontawesome.com/db09709f66.js" crossorigin="anonymous"></script>
    <title>Witchy</title>
</head>
<body>
    <header>
        <h1>Witchy</h1>
        <nav class="top">
            <div class="darkmode">
                <i class="fa-regular fa-moon"></i>
            </div>
            <h2 class="month">Month</h2>
            <div class="calendarImg">
                <a href="calendar.html" target="_blank" rel="noopener">
                    <img src="images/calendar.png" alt="emoji of a calendar">
                </a>
            </div>
        </nav>
    </header>
    <main>
        <section class="week">
            <div class="weekdays">
                <div class="day">
                    <span class="dayLabel">S</span>
                    <span class="dayNumber">25</span>
                </div>
                <div class="day">
                    <span class="dayLabel">M</span>
                    <span class="dayNumber">25</span>
                </div>
                <div class="day">
                    <span class="dayLabel">T</span>
                    <span class="dayNumber">25</span>
                </div>
                <div class="day">
                    <span class="dayLabel">Today</span>
                    <span class="dayNumber">25</span>
                </div>
                <div class="day">
                    <span class="dayLabel">T</span>
                    <span class="dayNumber">47</span>
                </div>
                <div class="day">
                    <span class="dayLabel">F</span>
                    <span class="dayNumber">47</span>
                </div>
                <div class="day">
                    <span class="dayLabel">S</span>
                    <span class="dayNumber">74</span>
                </div>
            </div>
        </section>
        <section class="phase">
            <h3>Prediction</h3>
            <div class="prediction">
                Fertile window in <br>
                5 days
            </div>
        </section>
        <nav class="bottom">
            <section class="logImg">
                <a href="calendar.html" target="_blank" rel="noopener">
                    <img src="images/drops.png" alt="emoji of drops">
                </a>
                <p>Log Period</p>
            </section>
            <section class="symptomsImg">
                <a href="symptoms.html">
                    <img src="images/plus.png" alt="emoji of plus sign">
                </a>
                <p>Symptoms</p>
            </section>
        </nav>
        <footer>
            <p>Website developed by Tainá Klein <i class="fa-regular fa-copyright"></i> 2026</p>
        </footer>
    </main>
</body>
</html>
